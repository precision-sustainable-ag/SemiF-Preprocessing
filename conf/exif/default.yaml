Image:
  # ProcessingSoftware:                       # Ascii   The name and version of the software used to post-process the picture.
  # NewSubfileType:                           # Long    A general indication of the kind of data contained in this subfile.
  # SubfileType:                              # Short   A general indication of the kind of data contained in this subfile. This field is deprecated. The NewSubfileType field should be used instead.
  ImageWidth: 13368                           # Long    The number of columns of image data, equal to the number of pixels per row. In JPEG compressed data a JPEG marker is used instead of this tag.
  ImageHeight: 9520                         # Long    The number of rows of image data. In JPEG compressed data a JPEG marker is used instead of this tag.
  BitsPerSample: 16                         # Short   The number of bits per image component. In this standard each component of the image is 8 bits, so the value for this tag is 8. See also <SamplesPerPixel>. In JPEG compressed data a JPEG marker is used instead of this tag.
#   Compression:                              # Short   The compression scheme used for the image data. When a primary image is JPEG compressed, this designation is not necessary and is omitted. When thumbnails use JPEG compression, this tag value is set to 6.
  # PhotometricInterpretation: 32803          # Short   The pixel composition. In JPEG compressed data a JPEG marker is used instead of this tag.
#   Thresholding:                             # Short   For black and white TIFF files that represent shades of gray, the technique used to convert from gray to black and white pixels.
#   CellWidth:                                # Short   The width of the dithering or halftoning matrix used to create a dithered or halftoned bilevel file.
#   CellLength:                               # Short   The length of the dithering or halftoning matrix used to create a dithered or halftoned bilevel file.
#   FillOrder:                                # Short   The logical order of bits within a byte.
#   DocumentName:                             # Ascii   The name of the document from which this image was scanned.
#   ImageDescription:                         # Ascii   A character string giving the title of the image. It may be a comment such as "1988 company picnic" or the like. Two-bytes character codes cannot be used. When a 2-bytes code is necessary, the Exif Private tag <UserComment> is to be used.
  Make: SVS_VISTEK                          # Ascii   The manufacturer of the recording equipment. This is the manufacturer of the DSC, scanner, video digitizer or other equipment that generated the image. When the field is left blank, it is treated as unknown.
  Model: shr661CXGE                         # Ascii   The model name or model number of the equipment. This is the model name or number of the DSC, scanner, video digitizer or other equipment that generated the image. When the field is left blank, it is treated as unknown.
#   StripOffsets:                             # Long    For each strip, the byte offset of that strip. It is recommended that this be selected so the number of strip bytes does not exceed 64 Kbytes. With JPEG compressed data this designation is not needed and is omitted. See also <RowsPerStrip> and <StripByteCounts>.
  # Orientation: 1                            # Short   The image orientation viewed in terms of rows and columns.
  SamplesPerPixel: 1                        # Short   The number of components per pixel. Since this standard applies to RGB and YCbCr images, the value set for this tag is 3. In JPEG compressed data a JPEG marker is used instead of this tag.
#   RowsPerStrip:                             # Long    The number of rows per strip. This is the number of rows in the image of one strip when an image is divided into strips. With JPEG compressed data this designation is not needed and is omitted. See also <StripOffsets> and <StripByteCounts>.
#   StripByteCounts:                          # Long    The total number of bytes in each strip. With JPEG compressed data this designation is not needed and is omitted.
#   XResolution:                              # Rational The number of pixels per <ResolutionUnit> in the <ImageWidth> direction. When the image resolution is unknown, 72 [dpi] is designated.
#   YResolution:                              # Rational The number of pixels per <ResolutionUnit> in the <ImageLength> direction. The same value as <XResolution> is designated.
#   PlanarConfiguration:                      # Short   Indicates whether pixel components are recorded in a chunky or planar format. In JPEG compressed files a JPEG marker is used instead of this tag. If this field does not exist, the TIFF default of 1 (chunky) is assumed.
#   PageName:                                 # Ascii   The name of the page from which this image was scanned.
#   XPosition:                                # Rational X position of the image. The X offset in ResolutionUnits of the left side of the image, with respect to the left side of the page.
#   YPosition:                                # Rational Y position of the image. The Y offset in ResolutionUnits of the top of the image, with respect to the top of the page. In the TIFF coordinate scheme, the positive Y direction is down, so that YPosition is always positive.
#   GrayResponseUnit:                         # Short   The precision of the information contained in the GrayResponseCurve.
#   GrayResponseCurve:                        # Short   For grayscale data, the optical density of each possible pixel value.
#   T4Options:                                # Long    T.4-encoding options.
#   T6Options:                                # Long    T.6-encoding options.
#   ResolutionUnit:                           # Short   The unit for measuring <XResolution> and <YResolution>. The same unit is used for both <XResolution> and <YResolution>. If the image resolution is unknown, 2 (inches) is designated.
#   PageNumber:                               # Short   The page number of the page from which this image was scanned.
#   TransferFunction:                         # Short   A transfer function for the image, described in tabular style. Normally this tag is not necessary, since color space is specified in the color space information tag (<ColorSpace>).
#   Software:                                 # Ascii   This tag records the name and version of the software or firmware of the camera or image input device used to generate the image. The detailed format is not specified, but it is recommended that the example shown below be followed. When the field is left blank, it is treated as unknown.
#   DateTime:                                 # Ascii   The date and time of image creation. In Exif standard, it is the date and time the file was changed.
#   Artist:                                   # Ascii   This tag records the name of the camera owner, photographer or image creator. The detailed format is not specified, but it is recommended that the information be written as in the example below for ease of Interoperability. When the field is left blank, it is treated as unknown. Ex.) "Camera owner, John Smith; Photographer, Michael Brown; Image creator, Ken James".
#   HostComputer:                             # Ascii   This tag records information about the host computer used to generate the image.
#   Predictor:                                # Short   A predictor is a mathematical operator that is applied to the image data before an encoding scheme is applied.
#   WhitePoint:                               # Rational The chromaticity of the white point of the image. Normally this tag is not necessary, since color space is specified in the colorspace information tag (<ColorSpace>).
#   PrimaryChromaticities:                    # Rational The chromaticity of the three primary colors of the image. Normally this tag is not necessary, since colorspace is specified in the colorspace information tag (<ColorSpace>).
#   ColorMap:                                 # Short   A color map for palette color images. This field defines a Red-Green-Blue color map (often called a lookup table) for palette-color images. In a palette-color image, a pixel value is used to index into an RGB lookup table.
#   HalftoneHints:                            # Short   The purpose of the HalftoneHints field is to convey to the halftone function the range of gray levels within a colorimetrically-specified image that should retain tonal detail.
#   TileWidth:                                # Long    The tile width in pixels. This is the number of columns in each tile.
#   TileLength:                               # Long    The tile length (height) in pixels. This is the number of rows in each tile.
#   TileOffsets:                              # Short   For each tile, the byte offset of that tile, as compressed and stored on disk. The offset is specified with respect to the beginning of the TIFF file. Note that this implies that each tile has a location independent of the locations of other tiles.
#   TileByteCounts:                           # Long    For each tile, the number of (compressed) bytes in that tile. See TileOffsets for a description of how the byte counts are ordered.
#   SubIFDs:                                  # Long    Defined by Adobe Corporation to enable TIFF Trees within a TIFF file.
#   InkSet:                                   # Short   The set of inks used in a separated (PhotometricInterpretation=5) image.
#   InkNames:                                 # Ascii   The name of each ink used in a separated (PhotometricInterpretation=5) image.
#   NumberOfInks:                             # Short   The number of inks. Usually equal to SamplesPerPixel, unless there are extra samples.
#   DotRange:                                 # Byte    The component values that correspond to a 0% dot and 100% dot.
#   TargetPrinter:                            # Ascii   A description of the printing environment for which this separation is intended.
#   ExtraSamples:                             # Short   Specifies that each pixel has m extra components whose interpretation is defined by one of the values listed below.
#   SampleFormat:                             # Short   This field specifies how to interpret each data sample in a pixel.
#   SMinSampleValue:                          # Short   This field specifies the minimum sample value.
#   SMaxSampleValue:                          # Short   This field specifies the maximum sample value.
#   TransferRange:                            # Short   Expands the range of the TransferFunction.
#   ClipPath:                                 # Byte    A TIFF ClipPath is intended to mirror the essentials of PostScript's path creation functionality.
#   XClipPathUnits:                           # SShort  The number of units that span the width of the image, in terms of integer ClipPath coordinates.
#   YClipPathUnits:                           # SShort  The number of units that span the height of the image, in terms of integer ClipPath coordinates.
#   Indexed:                                  # Short   Indexed images are images where the 'pixels' do not represent color values, but rather an index (usually 8-bit) into a separate color table, the ColorMap.
#   JPEGTables:                               # Undefined This optional tag may be used to encode the JPEG quantization and Huffman tables for subsequent use by the JPEG decompression process.
#   OPIProxy:                                 # Short   OPIProxy gives information concerning whether this image is a low-resolution proxy of a high-resolution image (Adobe OPI).
#   JPEGProc:                                 # Long    This field indicates the process used to produce the compressed data.
#   JPEGInterchangeFormat:                    # Long    The offset to the start byte (SOI) of JPEG compressed thumbnail data. This is not used for primary image JPEG data.
#   JPEGInterchangeFormatLength:              # Long    The number of bytes of JPEG compressed thumbnail data. This is not used for primary image JPEG data. JPEG thumbnails are not divided but are recorded as a continuous JPEG bitstream from SOI to EOI. Appn and COM markers should not be recorded. Compressed thumbnails must be recorded in no more than 64 Kbytes, including all other data to be recorded in APP1.
#   JPEGRestartInterval:                      # Short   This Field indicates the length of the restart interval used in the compressed image data.
#   JPEGLosslessPredictors:                   # Short   This Field points to a list of lossless predictor-selection values, one per component.
#   JPEGPointTransforms:                      # Short   This Field points to a list of point transform values, one per component.
#   JPEGQTables:                              # Long    This Field points to a list of offsets to the quantization tables, one per component.
#   JPEGDCTables:                             # Long    This Field points to a list of offsets to the DC Huffman tables or the lossless Huffman tables, one per component.
#   JPEGACTables:                             # Long    This Field points to a list of offsets to the Huffman AC tables, one per component.
#   YCbCrCoefficients:                        # Rational The matrix coefficients for transformation from RGB to YCbCr image data. No default is given in TIFF; but here the value given in Appendix E, "Color Space Guidelines", is used as the default. The color space is declared in a color space information tag, with the default being the value that gives the optimal image characteristics Interoperability this condition.
#   YCbCrSubSampling:                         # Short   The sampling ratio of chrominance components in relation to the luminance component. In JPEG compressed data a JPEG marker is used instead of this tag.
#   YCbCrPositioning:                         # Short   The position of chrominance components in relation to the luminance component. This field is designated only for JPEG compressed data or uncompressed YCbCr data. The TIFF default is 1 (centered); but when Y:Cb:Cr = 4:2:2 it is recommended in this standard that 2 (co-sited) be used to record data, in order to improve the image quality when viewed on TV systems. When this field does not exist, the reader shall assume the TIFF default. In the case of Y:Cb:Cr = 4:2:0, the TIFF default (centered) is recommended. If the reader does not have the capability of supporting both kinds of <YCbCrPositioning>, it shall follow the TIFF default regardless of the value in this field. It is preferable that readers be able to support both centered and co-sited positioning.
#   ReferenceBlackWhite:                      # Rational The reference black point value and reference white point value. No defaults are given in TIFF, but the values below are given as defaults here. The color space is declared in a color space information tag, with the default being the value that gives the optimal image characteristics Interoperability these conditions.
#   XMLPacket:                                # Byte    XMP Metadata (Adobe technote 9-14-02).
#   Rating:                                   # Short   Rating tag used by Windows.
#   RatingPercent:                            # Short   Rating tag used by Windows, value in percent.
#   VignettingCorrParams:                     # SShort  Sony vignetting correction parameters.
#   ChromaticAberrationCorrParams:            # SShort  Sony chromatic aberration correction parameters.
#   DistortionCorrParams:                     # SShort  Sony distortion correction parameters.
#   ImageID:                                  # Ascii   ImageID is the full pathname of the original, high-resolution image, or any other identifying string that uniquely identifies the original image (Adobe OPI).
  # CFARepeatPatternDim: [2,2]                # Short   Contains two values representing the minimum rows and columns to define the repeating patterns of the color filter array.
  # CFAPattern: [0, 1, 1, 2]                  # Byte    Indicates the color filter array (CFA) geometric pattern of the image sensor when a one-chip color area sensor is used. It does not apply to all sensing methods.
#   BatteryLevel:                             # Rational Contains a value of the battery level as a fraction or string.
#   Copyright:                                # Ascii   Copyright information. In this standard the tag is used to indicate both the photographer and editor copyrights. It is the copyright notice of the person or organization claiming rights to the image. The Interoperability copyright statement including date and rights should be written in this field; e.g., "Copyright, John Smith, 19xx. All rights reserved.". In this standard the field records both the photographer and editor copyrights, with each recorded in a separate part of the statement. When there is a clear distinction between the photographer and editor copyrights, these are to be written in the order of photographer followed by editor copyright, separated by NULL (in this case since the statement also ends with a NULL, there are two NULL codes). When only the photographer copyright is given, it is terminated by one NULL code. When only the editor copyright is given, the photographer copyright part consists of one space followed by a terminating NULL code, then the editor copyright is given. When the field is left blank, it is treated as unknown.
#   ExposureTime:                             # Rational Exposure time, given in seconds.
#   FNumber:                                  # Rational The F number.
#   IPTCNAA:                                  # Long    Contains an IPTC/NAA record.
#   ImageResources:                           # Byte    Contains information embedded by the Adobe Photoshop application.
#   ExifTag:                                  # Long    A pointer to the Exif IFD. Interoperability, Exif IFD has the same structure as that of the IFD specified in TIFF. ordinarily, however, it does not contain image data as in the case of TIFF.
#   InterColorProfile:                        # Undefined Contains an InterColor Consortium (ICC) format color space characterization/profile.
#   ExposureProgram:                          # Short   The class of the program used by the camera to set exposure when the picture is taken.
#   SpectralSensitivity:                      # Ascii   Indicates the spectral sensitivity of each channel of the camera used.
#   GPSTag:                                   # Long    A pointer to the GPS Info IFD. The Interoperability structure of the GPS Info IFD, like that of Exif IFD, has no image data.
#   ISOSpeedRatings:                          # Short   Indicates the ISO Speed and ISO Latitude of the camera or input device as specified in ISO 12232.
#   OECF:                                     # Undefined Indicates the Opto-Electric Conversion Function (OECF) specified in ISO 14524.
#   Interlace:                                # Short   Indicates the field number of multifield images.
  TimeZoneOffset: -4                           # SShort   This optional tag encodes the time zone of the camera clock (relative to Greenwich Mean Time) used to create the DataTimeOriginal tag-value when the picture was taken. It may also contain the time zone offset of the clock used to create the DateTime tag-value when the image was modified.
#   SelfTimerMode:                            # Short    Number of seconds image capture was delayed from button press.
#   DateTimeOriginal:                         # Ascii    The date and time when the original image data was generated.
#   CompressedBitsPerPixel:                   # Rational Specific to compressed data; states the compressed bits per pixel.
#   ShutterSpeedValue:                        # SRational Shutter speed.
#   ApertureValue:                            # Rational The lens aperture.
#   BrightnessValue:                          # SRational The value of brightness.
#   ExposureBiasValue:                        # SRational The exposure bias.
#   MaxApertureValue:                         # Rational The smallest F number of the lens.
#   SubjectDistance:                          # SRational The distance to the subject, given in meters.
#   MeteringMode:                             # Short    The metering mode.
#   LightSource:                              # Short    The kind of light source.
#   Flash:                                    # Short    Indicates the status of flash when the image was shot.
  FocalLength: 60                           # Rational The actual focal length of the lens, in mm.
#   FlashEnergy:                              # Rational Amount of flash energy (BCPS).
#   SpatialFrequencyResponse:                 # Undefined SFR of the camera.
#   Noise:                                    # Undefined Noise measurement values.
#   FocalPlaneXResolution:                    # Rational Number of pixels per FocalPlaneResolutionUnit (37392) in ImageWidth direction for main image.
#   FocalPlaneYResolution:                    # Rational Number of pixels per FocalPlaneResolutionUnit (37392) in ImageLength direction for main image.
#   FocalPlaneResolutionUnit:                 # Short    Unit of measurement for FocalPlaneXResolution(37390) and FocalPlaneYResolution(37391).
#   ImageNumber:                              # Long     Number assigned to an image, e.g., in a chained image burst.
#   SecurityClassification:                   # Ascii    Security classification assigned to the image.
#   ImageHistory:                             # Ascii    Record of what has been done to the image.
#   SubjectLocation:                          # Short    Indicates the location and area of the main subject in the overall scene.
#   ExposureIndex:                            # Rational Encodes the camera exposure index setting when image was captured.
#   TIFFEPStandardID:                         # Byte     Contains four ASCII characters representing the TIFF/EP standard version of a TIFF/EP file, eg '1', '0', '0', '0'.
#   SensingMethod:                            # Short    Type of image sensor.
#   XPTitle:                                  # Byte     Title tag used by Windows, encoded in UCS2.
#   XPComment:                                # Byte     Comment tag used by Windows, encoded in UCS2.
#   XPAuthor:                                 # Byte     Author tag used by Windows, encoded in UCS2.
#   XPKeywords:                               # Byte     Keywords tag used by Windows, encoded in UCS2.
#   XPSubject:                                # Byte     Subject tag used by Windows, encoded in UCS2.
#   PrintImageMatching:                       # Undefined Print Image Matching, description needed.
#   DNGVersion:                               # Byte     This tag encodes the DNG four-tier version number. For files compliant with version 1.1.0.0 of the DNG specification, this tag should contain the bytes: 1, 1, 0, 0.
#   DNGBackwardVersion:                       # Byte     This tag specifies the oldest version of the Digital Negative specification for which a file is compatible. Readers should not attempt to read a file if this tag specifies a version number that is higher than the version number of the specification the reader was based on. In addition to checking the version tags, readers should, for all tags, check the types, counts, and values, to verify it is able to correctly read the file.
#   UniqueCameraModel:                        # Ascii    Defines a unique, non-localized name for the camera model that created the image in the raw file. This name should include the manufacturer's name to avoid conflicts, and should not be localized, even if the camera name itself is localized for different markets (see LocalizedCameraModel). This string may be used by reader software to index into per-model preferences and replacement profiles.
#   LocalizedCameraModel:                     # Byte     Similar to the UniqueCameraModel field, except the name can be localized for different markets to match the localization of the camera name.
#   CFAPlaneColor:                            # Byte     Provides a mapping between the values in the CFAPattern tag and the plane numbers in LinearRaw space. This is a required tag for non-RGB CFA images.
#   CFALayout:                                # Short    Describes the spatial layout of the CFA.
#   LinearizationTable:                       # Short    Describes a lookup table that maps stored values into linear values. This tag is typically used to increase compression ratios by storing the raw data in a non-linear, more visually uniform space with fewer total encoding levels. If SamplesPerPixel is not equal to one, this single table applies to all the samples for each pixel.
#   BlackLevelRepeatDim:                      # Short    Specifies repeat pattern size for the BlackLevel tag.
#   BlackLevel:                               # Rational Specifies the zero light (a.k.a. thermal black or black current) encoding level, as a repeating pattern. The origin of this pattern is the top-left corner of the ActiveArea rectangle. The values are stored in row-column-sample scan order.
#   BlackLevelDeltaH:                         # SRational If the zero light encoding level is a function of the image column, BlackLevelDeltaH specifies the difference between the zero light encoding level for each column and the baseline zero light encoding level. If SamplesPerPixel is not equal to one, this single table applies to all the samples for each pixel.
#   BlackLevelDeltaV:                         # SRational If the zero light encoding level is a function of the image row, this tag specifies the difference between the zero light encoding level for each row and the baseline zero light encoding level. If SamplesPerPixel is not equal to one, this single table applies to all the samples for each pixel.
#   WhiteLevel:                               # Long     This tag specifies the fully saturated encoding level for the raw sample values. Saturation is caused either by the sensor itself becoming highly non-linear in response, or by the camera's analog to digital converter clipping.
#   DefaultScale:                             # Rational DefaultScale is required for cameras with non-square pixels. It specifies the default scale factors for each direction to convert the image to square pixels. Typically these factors are selected to approximately preserve total pixel count. For CFA images that use CFALayout equal to 2, 3, 4, or 5, such as the Fujifilm SuperCCD, these two values should usually differ by a factor of 2.0.
#   DefaultCropOrigin:                        # Long     Raw images often store extra pixels around the edges of the final image. These extra pixels help prevent interpolation artifacts near the edges of the final image. DefaultCropOrigin specifies the origin of the final image area, in raw image coordinates (i.e., before the DefaultScale has been applied), relative to the top-left corner of the ActiveArea rectangle.
#   DefaultCropSize:                          # Long     Raw images often store extra pixels around the edges of the final image. These extra pixels help prevent interpolation artifacts near the edges of the final image. DefaultCropSize specifies the size of the final image area, in raw image coordinates (i.e., before the DefaultScale has been applied).
#   ColorMatrix1:                             # SRational ColorMatrix1 defines a transformation matrix that converts XYZ values to reference camera native color space values, under the first calibration illuminant. The matrix values are stored in row scan order. The ColorMatrix1 tag is required for all non-monochrome DNG files.
#   ColorMatrix2:                             # SRational ColorMatrix2 defines a transformation matrix that converts XYZ values to reference camera native color space values, under the second calibration illuminant. The matrix values are stored in row scan order.
#   CameraCalibration1:                       # SRational CameraCalibration1 defines a calibration matrix that transforms reference camera native space values to individual camera native space values under the first calibration illuminant. The matrix is stored in row scan order. This matrix is stored separately from the matrix specified by the ColorMatrix1 tag to allow raw converters to swap in replacement color matrices based on UniqueCameraModel tag, while still taking advantage of any per-individual camera calibration performed by the camera manufacturer.
#   CameraCalibration2:                       # SRational CameraCalibration2 defines a calibration matrix that transforms reference camera native space values to individual camera native space values under the second calibration illuminant. The matrix is stored in row scan order. This matrix is stored separately from the matrix specified by the ColorMatrix2 tag to allow raw converters to swap in replacement color matrices based on UniqueCameraModel tag, while still taking advantage of any per-individual camera calibration performed by the camera manufacturer.
#   ReductionMatrix1:                         # SRational ReductionMatrix1 defines a dimensionality reduction matrix for use as the first stage in converting color camera native space values to XYZ values, under the first calibration illuminant. This tag may only be used if ColorPlanes is greater than 3. The matrix is stored in row scan order.
#   ReductionMatrix2:                         # SRational ReductionMatrix2 defines a dimensionality reduction matrix for use as the first stage in converting color camera native space values to XYZ values, under the second calibration illuminant. This tag may only be used if ColorPlanes is greater than 3. The matrix is stored in row scan order.
#   AnalogBalance:                            # Rational Normally the stored raw values are not white balanced, since any digital white balancing will reduce the dynamic range of the final image if the user decides to later adjust the white balance; however, if camera hardware is capable of white balancing the color channels before the signal is digitized, it can improve the dynamic range of the final image. AnalogBalance defines the gain, either analog (recommended) or digital (not recommended) that has been applied the stored raw values.
#   AsShotNeutral:                            # Short    Specifies the selected white balance at time of capture, encoded as the coordinates of a perfectly neutral color in linear reference space values. The inclusion of this tag precludes the inclusion of the AsShotWhiteXY tag.
#   AsShotWhiteXY:                            #	Rational	Specifies the selected white balance at time of capture, encoded as x-y chromaticity coordinates. The inclusion of this tag precludes the inclusion of the AsShotNeutral tag.
#   BaselineExposure:                         # SRational  Camera models vary in the trade-off they make between highlight headroom and shadow noise. Some leave a significant amount of highlight headroom during a normal exposure. This allows significant negative exposure compensation to be applied during raw conversion, but also means normal exposures will contain more shadow noise. Other models leave less headroom during normal exposures. This allows for less negative exposure compensation, but results in lower shadow noise for normal exposures. Because of these differences, a raw converter needs to vary the zero point of its exposure compensation control from model to model. BaselineExposure specifies by how much (in EV units) to move the zero point. Positive values result in brighter default results, while negative values result in darker default results.
#   BaselineNoise:                            # Rational   Specifies the relative noise level of the camera model at a baseline ISO value of 100, compared to a reference camera model. Since noise levels tend to vary approximately with the square root of the ISO value, a raw converter can use this value, combined with the current ISO, to estimate the relative noise level of the current image.
#   BaselineSharpness:                        # Rational   Specifies the relative amount of sharpening required for this camera model, compared to a reference camera model. Camera models vary in the strengths of their anti-aliasing filters. Cameras with weak or no filters require less sharpening than cameras with strong anti-aliasing filters.
#   BayerGreenSplit:                          # Long       Only applies to CFA images using a Bayer pattern filter array. This tag specifies, in arbitrary units, how closely the values of the green pixels in the blue/green rows track the values of the green pixels in the red/green rows. A value of zero means the two kinds of green pixels track closely, while a non-zero value means they sometimes diverge. The useful range for this tag is from 0 (no divergence) to about 5000 (quite large divergence).
#   LinearResponseLimit:                      # Rational   Some sensors have an unpredictable non-linearity in their response as they near the upper limit of their encoding range. This non-linearity results in color shifts in the highlight areas of the resulting image unless the raw converter compensates for this effect. LinearResponseLimit specifies the fraction of the encoding range above which the response may become significantly non-linear.
#   CameraSerialNumber:                       # Ascii      CameraSerialNumber contains the serial number of the camera or camera body that captured the image.
#   LensInfo:                                 # Rational   Contains information about the lens that captured the image. If the minimum f-stops are unknown, they should be encoded as 0/0.
#   ChromaBlurRadius:                         # Rational   ChromaBlurRadius provides a hint to the DNG reader about how much chroma blur should be applied to the image. If this tag is omitted, the reader will use its default amount of chroma blurring. Normally this tag is only included for non-CFA images, since the amount of chroma blur required for mosaic images is highly dependent on the de-mosaic algorithm, in which case the DNG reader's default value is likely optimized for its particular de-mosaic algorithm.
#   AntiAliasStrength:                        # Rational   Provides a hint to the DNG reader about how strong the camera's anti-alias filter is. A value of 0.0 means no anti-alias filter (i.e., the camera is prone to aliasing artifacts with some subjects), while a value of 1.0 means a strong anti-alias filter (i.e., the camera almost never has aliasing artifacts).
#   ShadowScale:                              # SRational  This tag is used by Adobe Camera Raw to control the sensitivity of its 'Shadows' slider.
#   DNGPrivateData:                           # Byte       Provides a way for camera manufacturers to store private data in the DNG file for use by their own raw converters, and to have that data preserved by programs that edit DNG files.
#   MakerNoteSafety:                          # Short      MakerNoteSafety lets the DNG reader know whether the EXIF MakerNote tag is safe to preserve along with the rest of the EXIF data. File browsers and other image management software processing an image with a preserved MakerNote should be aware that any thumbnail image embedded in the MakerNote may be stale, and may not reflect the current state of the full size image.
#   CalibrationIlluminant1:                   # Short      The illuminant used for the first set of color calibration tags (ColorMatrix1, CameraCalibration1, ReductionMatrix1). The legal values for this tag are the same as the legal values for the LightSource EXIF tag. If set to 255 (Other), then the IFD must also include a IlluminantData1 tag to specify the x-y chromaticity or spectral power distribution function for this illuminant.
#   CalibrationIlluminant2:                   # Short      The illuminant used for an optional second set of color calibration tags (ColorMatrix2, CameraCalibration2, ReductionMatrix2). The legal values for this tag are the same as the legal values for the CalibrationIlluminant1 tag; however, if both are included, neither is allowed to have a value of 0 (unknown). If set to 255 (Other), then the IFD must also include a IlluminantData2 tag to specify the x-y chromaticity or spectral power distribution function for this illuminant.
#   BestQualityScale:                         # Rational   For some cameras, the best possible image quality is not achieved by preserving the total pixel count during conversion. For example, Fujifilm SuperCCD images have maximum detail when their total pixel count is doubled. This tag specifies the amount by which the values of the DefaultScale tag need to be multiplied to achieve the best quality image size.
#   RawDataUniqueID:                          # Byte       This tag contains a 16-byte unique identifier for the raw image data in the DNG file. DNG readers can use this tag to recognize a particular raw image, even if the file's name or the metadata contained in the file has been changed. If a DNG writer creates such an identifier, it should do so using an algorithm that will ensure that it is very unlikely two different images will end up having the same identifier.
#   OriginalRawFileName:                      # Byte       If the DNG file was converted from a non-DNG raw file, then this tag contains the file name of that original raw file.
#   OriginalRawFileData:                      # Undefined  If the DNG file was converted from a non-DNG raw file, then this tag contains the compressed contents of that original raw file. The contents of this tag always use the big-endian byte order. The tag contains a sequence of data blocks. Future versions of the DNG specification may define additional data blocks, so DNG readers should ignore extra bytes when parsing this tag. DNG readers should also detect the case where data blocks are missing from the end of the sequence, and should assume a default value for all the missing blocks. There are no padding or alignment bytes between data blocks.
#   ActiveArea:                               # Long       This rectangle defines the active (non-masked) pixels of the sensor. The order of the rectangle coordinates is: top, left, bottom, right.
#   MaskedAreas:                              # Long       This tag contains a list of non-overlapping rectangle coordinates of fully masked pixels, which can be optionally used by DNG readers to measure the black encoding level. The order of each rectangle's coordinates is: top, left, bottom, right. If the raw image data has already had its black encoding level subtracted, then this tag should not be used, since the masked pixels are no longer useful.
#   AsShotICCProfile:                         # Undefined  This tag contains an ICC profile that, in conjunction with the AsShotPreProfileMatrix tag, provides the camera manufacturer with a way to specify a default color rendering from camera color space coordinates (linear reference values) into the ICC profile connection space. The ICC profile connection space is an output referred colorimetric space, whereas the other color calibration tags in DNG specify a conversion into a scene referred colorimetric space. This means that the rendering in this profile should include any desired tone and gamut mapping needed to convert between scene referred values and output referred values.
#   AsShotPreProfileMatrix:                   # SRational  This tag is used in conjunction with the AsShotICCProfile tag. It specifies a matrix that should be applied to the camera color space coordinates before processing the values through the ICC profile specified in the AsShotICCProfile tag. The matrix is stored in the row scan order. If ColorPlanes is greater than three, then this matrix can (but is not required to) reduce the dimensionality of the color data down to three components, in which case the AsShotICCProfile should have three rather than ColorPlanes input components.
#   CurrentICCProfile:                        # Undefined  This tag is used in conjunction with the CurrentPreProfileMatrix tag. The CurrentICCProfile and CurrentPreProfileMatrix tags have the same purpose and usage as the AsShotICCProfile and AsShotPreProfileMatrix tag pair, except they are for use by raw file editors rather than camera manufacturers.
#   CurrentPreProfileMatrix:                  # SRational  This tag is used in conjunction with the CurrentICCProfile tag. The CurrentICCProfile and CurrentPreProfileMatrix tags have the same purpose and usage as the AsShotICCProfile and AsShotPreProfileMatrix tag pair, except they are for use by raw file editors rather than camera manufacturers.
#   ColorimetricReference:                    # Short      The DNG color model documents a transform between camera colors and CIE XYZ values. This tag describes the colorimetric reference for the CIE XYZ values. 0 = The XYZ values are scene-referred. 1 = The XYZ values are output-referred, using the ICC profile perceptual dynamic range. This tag allows output-referred data to be stored in DNG files and still processed correctly by DNG readers.
#   CameraCalibrationSignature:               # Byte       A UTF-8 encoded string associated with the CameraCalibration1 and CameraCalibration2 tags. The CameraCalibration1 and CameraCalibration2 tags should only be used in the DNG color transform if the string stored in the CameraCalibrationSignature tag exactly matches the string stored in the ProfileCalibrationSignature tag for the selected camera profile.
#   ProfileCalibrationSignature:              # Byte       A UTF-8 encoded string associated with the camera profile tags. The CameraCalibration1 and CameraCalibration2 tags should only be used in the DNG color transfer if the string stored in the CameraCalibrationSignature tag exactly matches the string stored in the ProfileCalibrationSignature tag for the selected camera profile.
#   ExtraCameraProfiles:                      # Long       A list of file offsets to extra Camera Profile IFDs. Note that the primary camera profile tags should be stored in IFD 0, and the ExtraCameraProfiles tag should only be used if there is more than one camera profile stored in the DNG file.
#   AsShotProfileName:                        # Byte       A UTF-8 encoded string containing the name of the "as shot" camera profile, if any.
#   NoiseReductionApplied:                    # Rational   This tag indicates how much noise reduction has been applied to the raw data on a scale of 0.0 to 1.0. A 0.0 value indicates that no noise reduction has been applied. A 1.0 value indicates that the "ideal" amount of noise reduction has been applied, i.e. that the DNG reader should not apply additional noise reduction by default. A value of 0/0 indicates that this parameter is unknown.
#   ProfileName:                              # Byte       A UTF-8 encoded string containing the name of the camera profile. This tag is optional if there is only a single camera profile stored in the file but is required for all camera profiles if there is more than one camera profile stored in the file.
#   ProfileHueSatMapDims:                     # Long       This tag specifies the number of input samples in each dimension of the hue/saturation/value mapping tables. The data for these tables are stored in ProfileHueSatMapData1, ProfileHueSatMapData2 and ProfileHueSatMapData3 tags. The most common case has ValueDivisions equal to 1, so only hue and saturation are used as inputs to the mapping table.
#   ProfileHueSatMapData1:                    # Float      This tag contains the data for the first hue/saturation/value mapping table. Each entry of the table contains three 32-bit IEEE floating-point values. The first entry is hue shift in degrees; the second entry is a saturation scale factor; and the third entry is a value scale factor. The table entries are stored in the tag in nested loop order, with the value divisions in the outer loop, the hue divisions in the middle loop, and the saturation divisions in the inner loop. All zero input saturation entries are required to have a value scale factor of 1.0.
#   ProfileHueSatMapData2:                    # Float      This tag contains the data for the second hue/saturation/value mapping table. Each entry of the table contains three 32-bit IEEE floating-point values. The first entry is hue shift in degrees; the second entry is a saturation scale factor; and the third entry is a value scale factor. The table entries are stored in the tag in nested loop order, with the value divisions in the outer loop, the hue divisions in the middle loop, and the saturation divisions in the inner loop. All zero input saturation entries are required to have a value scale factor of 1.0.
#   ProfileToneCurve:                         # Float      This tag contains a default tone curve that can be applied while processing the image as a starting point for user adjustments. The curve is specified as a list of 32-bit IEEE floating-point value pairs in linear gamma. Each sample has an input value in the range of 0.0 to 1.0, and an output value in the range of 0.0 to 1.0. The first sample is required to be (0.0, 0.0), and the last sample is required to be (1.0, 1.0). Interpolated the curve using a cubic spline.
#   ProfileEmbedPolicy:                       # Long       This tag contains information about the usage rules for the associated camera profile.
#   ProfileCopyright:                         # Byte       A UTF-8 encoded string containing the copyright information for the camera profile. This string always should be preserved along with the other camera profile tags.
#   ForwardMatrix1:                           # SRational  This tag defines a matrix that maps white balanced camera colors to XYZ D50 colors.
#   ForwardMatrix2:                           # SRational  This tag defines a matrix that maps white balanced camera colors to XYZ D50 colors.
#   PreviewApplicationName:                   # Byte       A UTF-8 encoded string containing the name of the application that created the preview stored in the IFD.
#   PreviewApplicationVersion:                # Byte       A UTF-8 encoded string containing the version number of the application that created the preview stored in the IFD.
#   PreviewSettingsName:                      # Byte       A UTF-8 encoded string containing the name of the conversion settings (for example, snapshot name) used for the preview stored in the IFD.
#   PreviewSettingsDigest:                    # Byte       A unique ID of the conversion settings (for example, MD5 digest) used to render the preview stored in the IFD.
#   PreviewColorSpace: 2                      # Long       This tag specifies the color space in which the rendered preview in this IFD is stored. The default value for this tag is sRGB for color previews and Gray Gamma 2.2 for monochrome previews.
#   PreviewDateTime:                          # Ascii      This tag is an ASCII string containing the name of the date/time at which the preview stored in the IFD was rendered. The date/time is encoded using ISO 8601 format.
#   RawImageDigest:                           # Undefined  This tag is an MD5 digest of the raw image data. All pixels in the image are processed in row-scan order. Each pixel is zero padded to 16 or 32 bits deep (16-bit for data less than or equal to 16 bits deep, 32-bit otherwise). The data for each pixel is processed in little-endian byte order.
#   OriginalRawFileDigest:                    #	Undefined	This tag is an MD5 digest of the data stored in the OriginalRawFileData tag.
#   SubTileBlockSize:                         #	Long	Normally, the pixels within a tile are stored in simple row-scan order. This tag specifies that the pixels within a tile should be grouped first into rectangular blocks of the specified size. These blocks are stored in row-scan order. Within each block, the pixels are stored in row-scan order. The use of a non-default value for this tag requires setting the DNGBackwardVersion tag to at least 1.2.0.0.
#   RowInterleaveFactor:                      #	Long	This tag specifies that rows of the image are stored in interleaved order. The value of the tag specifies the number of interleaved fields. The use of a non-default value for this tag requires setting the DNGBackwardVersion tag to at least 1.2.0.0.
#   ProfileLookTableDims:                     #	Long	This tag specifies the number of input samples in each dimension of a default "look" table. The data for this table is stored in the ProfileLookTableData tag.
#   ProfileLookTableData:                     #	Float	This tag contains a default "look" table that can be applied while processing the image as a starting point for user adjustment. This table uses the same format as the tables stored in the ProfileHueSatMapData1 and ProfileHueSatMapData2 tags, and is applied in the same color space. However, it should be applied later in the processing pipe, after any exposure compensation and/or fill light stages, but before any tone curve stage. Each entry of the table contains three 32-bit IEEE floating-point values. The first entry is hue shift in degrees, the second entry is a saturation scale factor, and the third entry is a value scale factor. The table entries are stored in the tag in nested loop order, with the value divisions in the outer loop, the hue divisions in the middle loop, and the saturation divisions in the inner loop. All zero input saturation entries are required to have a value scale factor of 1.0.
#   OpcodeList1:                              #	Undefined	Specifies the list of opcodes that should be applied to the raw image, as read directly from the file.
#   OpcodeList2:                              #	Undefined	Specifies the list of opcodes that should be applied to the raw image, just after it has been mapped to linear reference values.
#   OpcodeList3:                              #	Undefined	Specifies the list of opcodes that should be applied to the raw image, just after it has been demosaiced.
#   NoiseProfile:                             #	Double	NoiseProfile describes the amount of noise in a raw image. Specifically, this tag models the amount of signal-dependent photon (shot) noise and signal-independent sensor readout noise, two common sources of noise in raw images. The model assumes that the noise is white and spatially independent, ignoring fixed pattern effects and other sources of noise (e.g., pixel response non-uniformity, spatially-dependent thermal effects, etc.).
#   TimeCodes:                                #	Byte	The optional TimeCodes tag shall contain an ordered array of time codes. All time codes shall be 8 bytes long and in binary format. The tag may contain from 1 to 10 time codes. When the tag contains more than one time code, the first one shall be the default time code. This specification does not prescribe how to use multiple time codes. Each time code shall be as defined for the 8-byte time code structure in SMPTE 331M-2004, Section 8.3. See also SMPTE 12-1-2008 and SMPTE 309-1999.
#   FrameRate:                                #	SRational	The optional FrameRate tag shall specify the video frame rate in number of image frames per second, expressed as a signed rational number. The numerator shall be non-negative and the denominator shall be positive. This field value is identical to the sample rate field in SMPTE 377-1-2009.
#   TStop:                                    #	SRational	The optional TStop tag shall specify the T-stop of the actual lens, expressed as an unsigned rational number. T-stop is also known as T-number or the photometric aperture of the lens. (F-number is the geometric aperture of the lens.) When the exact value is known, the T-stop shall be specified using a single number. Alternately, two numbers shall be used to indicate a T-stop range, in which case the first number shall be the minimum T-stop and the second number shall be the maximum T-stop.
#   ReelName:                                 #	Ascii	The optional ReelName tag shall specify a name for a sequence of images, where each image in the sequence has a unique image identifier (including but not limited to file name, frame number, date time, time code).
  # CameraLabel:                              #	Ascii	The optional CameraLabel tag shall specify a text label for how the camera is used or assigned in this clip. This tag is similar to CameraLabel in XMP.
#   OriginalDefaultFinalSize:                 #	Long	If this file is a proxy for a larger original DNG file, this tag specifics the default final size of the larger original file from which this proxy was generated. The default value for this tag is default final size of the current DNG file, which is DefaultCropSize * DefaultScale.
#   OriginalBestQualityFinalSize:             #	Long	If this file is a proxy for a larger original DNG file, this tag specifics the best quality final size of the larger original file from which this proxy was generated. The default value for this tag is the OriginalDefaultFinalSize, if specified. Otherwise the default value for this tag is the best quality size of the current DNG file, which is DefaultCropSize * DefaultScale * BestQualityScale.
#   OriginalDefaultCropSize:                  #	Long	If this file is a proxy for a larger original DNG file, this tag specifics the DefaultCropSize of the larger original file from which this proxy was generated. The default value for this tag is OriginalDefaultFinalSize, if specified. Otherwise, the default value for this tag is the DefaultCropSize of the current DNG file.
#   ProfileHueSatMapEncoding:                 #	Long	Provides a way for color profiles to specify how indexing into a 3D HueSatMap is performed during raw conversion. This tag is not applicable to 2.5D HueSatMap tables (i.e., where the Value dimension is 1).
#   ProfileLookTableEncoding:                 #	Long	Provides a way for color profiles to specify how indexing into a 3D LookTable is performed during raw conversion. This tag is not applicable to a 2.5D LookTable (i.e., where the Value dimension is 1).
#   BaselineExposureOffset:                   #	SRational	Provides a way for color profiles to increase or decrease exposure during raw conversion. BaselineExposureOffset specifies the amount (in EV units) to add to the BaselineExposure tag during image rendering. For example, if the BaselineExposure value for a given camera model is +0.3, and the BaselineExposureOffset value for a given camera profile used to render an image for that camera model is -0.7, then the actual default exposure value used during rendering will be +0.3 - 0.7 = -0.4.
#   DefaultBlackRender:                       #	Long	This optional tag in a color profile provides a hint to the raw converter regarding how to handle the black point (e.g., flare subtraction) during rendering. If set to Auto, the raw converter should perform black subtraction during rendering. If set to None, the raw converter should not perform any black subtraction during rendering.
#   NewRawImageDigest:                        #	Byte	This tag is a modified MD5 digest of the raw image data. It has been updated from the algorithm used to compute the RawImageDigest tag be more multi-processor friendly, and to support lossy compression algorithms.
#   RawToPreviewGain:                         #	Double	The gain (what number the sample values are multiplied by) between the main raw IFD and the preview IFD containing this tag.
#   DefaultUserCrop:                          #	Rational	Specifies a default user crop rectangle in relative coordinates. The values must satisfy: 0.0 <= top < bottom <= 1.0, 0.0 <= left < right <= 1.0.The default values of (top = 0, left = 0, bottom = 1, right = 1) correspond exactly to the default crop rectangle (as specified by the DefaultCropOrigin and DefaultCropSize tags).
#   DepthFormat:                              #	Short	Specifies the encoding of any depth data in the file. Can be unknown (apart from nearer distances being closer to zero, and farther distances being closer to the maximum value), linear (values vary linearly from zero representing DepthNear to the maximum value representing DepthFar), or inverse (values are stored inverse linearly, with zero representing DepthNear and the maximum value representing DepthFar).
#   DepthNear:                                #	Rational	Specifies distance from the camera represented by the zero value in the depth map. 0/0 means unknown.
#   DepthFar:                                 #	Rational	Specifies distance from the camera represented by the maximum value in the depth map. 0/0 means unknown. 1/0 means infinity, which is valid for unknown and inverse depth formats.
#   DepthUnits:                               #	Short	Specifies the measurement units for the DepthNear and DepthFar tags.
#   DepthMeasureType:                         #	Short	Specifies the measurement geometry for the depth map. Can be unknown, measured along the optical axis, or measured along the optical ray passing through each pixel.
#   EnhanceParams:                            #	Ascii	A string that documents how the enhanced image data was processed.
#   ProfileGainTableMap:                      #	Undefined	Contains spatially varying gain tables that can be applied while processing the image as a starting point for user adjustments.
#   SemanticName:                             #	Ascii	A string that identifies the semantic mask.
#   SemanticInstanceID:                       #	Ascii	A string that identifies a specific instance in a semantic mask.
#   CalibrationIlluminant3:                   #	Short	The illuminant used for an optional third set of color calibration tags (ColorMatrix3, CameraCalibration3, ReductionMatrix3). The legal values for this tag are the same as the legal values for the LightSource EXIF tag; CalibrationIlluminant1 and CalibrationIlluminant2 must also be present. If set to 255 (Other), then the IFD must also include a IlluminantData3 tag to specify the x-y chromaticity or spectral power distribution function for this illuminant.
