name: Run SemiF-Preprocessing Pipeline

on:
  issues:
    types: [labeled]

jobs:
  run-pipeline:
    if: |
      github.event_name == 'issues' &&
      contains(github.event.issue.title, 'Batch Processing Request') &&
      contains(github.event.issue.body, '### Batch ID') &&
      (github.event.label.name == 'queued')
    runs-on: [self-hosted]
    timeout-minutes: 4320  # 72 hours
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate semifpre

      - name: Switch to 'running' label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PIPELINE_BOT_PAT }}
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            // Remove 'queued'
            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number,
              name: 'queued'
            });
            // Add 'running'
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ['running']
            });

      - name: Run SemiF-Preprocessing pipeline
        env:
          GITHUB_PAT: ${{ secrets.REPORT_BOT_PAT }}
        run: |
          # -------- Parse fields from the issue body ----------
          BODY="${{ github.event.issue.body }}"
        
          # Extract Batch ID (first non-empty line after "### Batch ID")
          BATCH_ID=$(echo "$BODY" | awk '/### Batch ID/{flag=1;next}/###/{flag=0}flag && NF{print; exit}' | xargs)

          # Extract Perform Reconstruction (true/false)
          PERFORM_RECON=$(echo "$BODY" | awk '/### Perform Reconstruction/{flag=1; next} flag && NF {print; exit}' | tr '[:upper:]' '[:lower:]' | xargs)

          # Extract Single Species (true/false)
          SINGLE_SPECIES=$(echo "$BODY" | awk '/### Single Species$/{flag=1; next} flag && NF {print; exit}' | tr '[:upper:]' '[:lower:]' | xargs)

          # Extract Single Species Common Name (soybean/zoysia/beet/etc.)
          SINGLE_SPECIES_NAME=$(echo "$BODY" | awk '/### Single Species Common Name/{flag=1; next} flag && NF {print; exit}' | xargs)

          # Extract optional skip counts
          SKIP_FIRST_N=$(echo "$BODY" | awk '/### Skip First N Images/{flag=1; next} flag && NF {print; exit}' | xargs)
          SKIP_LAST_N=$(echo "$BODY" | awk '/### Skip Last N Images/{flag=1; next} flag && NF {print; exit}' | xargs)

          # Start and end times
          START_TIME_RAW=$(echo "$BODY" | awk '/### Start Time/{flag=1; next} flag && NF {print; exit}')
          END_TIME_RAW=$(echo "$BODY" | awk '/### End Time/{flag=1; next} flag && NF {print; exit}')

          # Camera metadata
          CAM_ANGLE=$(echo "$BODY" | awk '/### Camera Angle/{flag=1; next} flag && NF {print; exit}' | xargs)
          Z_AXIS=$(echo "$BODY" | awk '/### Z-axis/{flag=1; next} flag && NF {print; exit}' | xargs)

          echo "Batch ID:               $BATCH_ID"
          echo "Perform Reconstruction: $PERFORM_RECON"
          echo "Single Species:         $SINGLE_SPECIES"
          echo "Species Name:           $SINGLE_SPECIES_NAME"
          echo "Skip First N:           ${SKIP_FIRST_N:-<none>}"
          echo "Skip Last N:            ${SKIP_LAST_N:-<none>}"
          echo "Camera Angle:           ${CAM_ANGLE:-<none>}"
          echo "Z-axis:                 ${Z_AXIS:-<none>}"

          # -------- Validate H:MM:SS AM/PM and convert to 24h --------
          normalize_time() {
            local t="$1"
            # allow either "1:22:12 PM" or "1:22:12PM" (case-insensitive)
            local compact="${t//[[:space:]]/}"
            if [[ "$compact" =~ ^([0-9]{1,2}):([0-5][0-9]):([0-5][0-9])([AaPp][Mm])$ ]]; then
              # capture groups
              local h="${BASH_REMATCH[1]}"
              local m="${BASH_REMATCH[2]}"
              local s="${BASH_REMATCH[3]}"
              local ap="${BASH_REMATCH[4]}"

              # force base-10 (kills the octal issue e.g. 09)
              h=$((10#$h))
              m=$((10#$m))
              s=$((10#$s))

              # validate hour
              if (( h < 1 || h > 12 )); then return 1; fi
              # Convert to 24h
              if [[ "$ap" =~ ^[Pp][Mm]$ ]]; then
                if (( h < 12 )); then h=$((h+12)); fi
              else
                if (( h == 12 )); then h=0; fi
              fi
              printf "%02d:%02d:%02d" "$h" "$m" "$s"
            else
              return 1
            fi
          }

          START_TIME=""
          END_TIME=""
          if [[ -n "$START_TIME_RAW" ]]; then
            if ! START_TIME=$(normalize_time "$START_TIME_RAW"); then
              echo "ERROR: Start Time must be H:MM:SS AM/PM (e.g., 1:22:12 PM). Got: '$START_TIME_RAW'"
              exit 1
            fi
          fi
          if [[ -n "$END_TIME_RAW" ]]; then
            if ! END_TIME=$(normalize_time "$END_TIME_RAW"); then
              echo "ERROR: End Time must be H:MM:SS AM/PM (e.g., 6:05:00 AM). Got: '$END_TIME_RAW'"
              exit 1
            fi
          fi

          echo "Start Time (24h):       ${START_TIME:-<none>}"
          echo "End Time (24h):         ${END_TIME:-<none>}"


          # -------- Build common args ----------
          BASE_ARGS=(batch_id="$BATCH_ID" create_issue=true)
          [[ -n "$SKIP_FIRST_N" ]] && BASE_ARGS+=("asfm.skip_first_n_images=$SKIP_FIRST_N")
          [[ -n "$SKIP_LAST_N"  ]] && BASE_ARGS+=("asfm.skip_last_n_images=$SKIP_LAST_N")
          [[ -n "$START_TIME"   ]] && BASE_ARGS+=("start_time=$START_TIME")
          [[ -n "$END_TIME"     ]] && BASE_ARGS+=("end_time=$END_TIME")
          [[ -n "$CAM_ANGLE"   ]] && BASE_ARGS+=("cam_angle=$CAM_ANGLE")
          [[ -n "$Z_AXIS" ]] && BASE_ARGS+=("z_axis=$Z_AXIS")

          if [[ "$PERFORM_RECON" == "false" ]]; then
            # ----- NO reconstruction path -----
            if [[ "$SINGLE_SPECIES" == "true" && -n "$SINGLE_SPECIES_NAME" ]]; then
              echo "Running NO-RECON single-species pipeline…"
              taskset -c 2-31 python main.py \
                "${BASE_ARGS[@]}" \
                modes=[correct,label,deliver] \
                tasks.label=[detect_plants,merge_overlapping_bboxes,no_remap_label] \
                assign_species.assign_all_bboxes.label="$SINGLE_SPECIES_NAME"
            else
              echo "Running NO-RECON multi-species pipeline…"
              taskset -c 2-31 python main.py \
                "${BASE_ARGS[@]}" \
                modes=[correct,label,deliver] \
                tasks.label=[detect_plants,merge_overlapping_bboxes,no_remap_label]
            fi
          else

            # ----- WITH reconstruction path -----
            echo "Running WITH-RECON pipeline…"
            # If you also want single-species labeling during recon, uncomment:
            # [[ "$SINGLE_SPECIES" == "true" && -n "$SINGLE_SPECIES_NAME" ]] && BASE_ARGS+=("assign_species.assign_all_bboxes.label=$SINGLE_SPECIES_NAME")
            taskset -c 2-31 python main.py "${BASE_ARGS[@]}"
          fi

      - name: Remove 'running' label (always runs)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PIPELINE_BOT_PAT }}
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'running'
              });
            } catch (e) {
              // Label might already be gone; ignore
            }

      # Adds 'completed' label on success:
      - name: Add processing-complete and needs-review labels (on success)
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PIPELINE_BOT_PAT }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['completed', 'needs-review']
            });

      # Add a 'failed' label on failure:
      - name: Add failed label (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PIPELINE_BOT_PAT }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['failed']
            });
