# Hydra defaults and settings. Ignore these (don't change)
defaults:
  - _self_
  - paths: default
  - exif: default
  - asfm: default
  - date_ranges: default
  - override hydra/job_logging: custom

hydra:
  run:
    dir: ${paths.log_dir}/${season}/${batch_id}/${job_now}
  output_subdir: ${hydra.run.dir}/hydra

job_now: &nowdir ${now:%Y-%m-%d}/${now:%H:%M:%S}

############################################
# Main configuration for the current batch
############################################
batch_id: ???
bbot_version:
season: # cash_crop_dicamba_2025, summer_weeds_2024  #cool_season_covers_2023_2024, cool_season_covers_2024_2025_bbotv30, cool_season_covers_2024_2025, cool_season_covers_2024_2025_NCpos2, summer_weeds_2024
create_issue: # set to true to create an issue in the bbot repo for this batch
crs:
gh_reviewer: # nnotaba or mkutu, map0425
timestamp: # epoch timestamp for raw2jpg. Anything before this timestamp will be ignored in the batch
run_mode: single # single or batch
start_time:
end_time:
cam_angle:
z_axis: 

# Toggle the modes you want to run
modes:
  # - sync
  # - correct
  # - asfm
  # - label
  # - deliver

# Toggle the tasks you want to run in each mode
tasks: # task for each mode
  sync:
    - sync_from_remote
  correct:
    - raw2jpg
    - update_exif
  asfm:
    - autosfm
  label:
    - detect_plants
    - remap_labels
    - assign_species
    # - no_remap_label # used for no remapping label task
  deliver:
    - inspect_images # deliver
    - move_data # deliver
    - report  # deliver

############################################
############################################

assign_species:
  assign_all_bboxes:
    enabled: false
    label: "Soybean"
    
inspection:
  inspect: false
  use_lts_images: false  # set true to inspect from LTS

rt_pp3_name: MD_shr661_raw16 # RawTherapee pp3 profile name without extension to use in raw2jpg
color_profile_name: MD_calibration_matrix_optimized # Npy file stem without extension for the color profile to use in raw2jpg

file_masks:
  raw_files:
    - .RAW
    - .raw
  dng_files:
    - .DNG
    - .dng
  png_files:
    - .png
    - .PNG
  
raw2jpg:
  jpg_samples: 0
  resize_factor: 0.25
  remove_dngs: true

max_workers: 16


inspect_images:
  save2lts: false

report:
  save2lts: true
  sample_size: 96 # best if this is a multiple of 12

detect:
  base_imgsz: 3072
  scales: [0.25, 0.5, 0.75, 1.0, 1.5]

  per_scale_conf: 0.0
  per_scale_iou: 1.0
  per_scale_max_det: 500

  wbf_iou: 0.55
  wbf_score_thr: 0.001

  edge_aware:
    enabled: true
    edge_band_rel: 0.08
    min_factor: 0.60
    taper_rel: 0.20

  conf: 0.3
  iou: 0.60
  final_max_det: 100

  post_fusion_nms:
    enabled: true
    iou: 0.40

  device: 3,4,5

  # Visualization settings (only for visualizations, not actual detection parameters)
  save_visualizations: true
  viz_sample_rate: 0.1   # 0.05 5% of images

  line_thickness_scale: 0.012
  min_line_thickness: 2
  max_line_thickness: 10
  font_scale: 0.8
  font_scale_factor: 0.0012

  viz_scale: 0.25          # 9000x13000 → ~2250x3250 (VERY manageable)
  viz_thickness_boost: 1.0 # optional (helps readability when downscaled)


