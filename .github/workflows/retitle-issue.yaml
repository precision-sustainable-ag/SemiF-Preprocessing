on:
  issues:
    types: [opened]

jobs:
  retitle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body;

            // Only proceed if this is the batch-processing-request form
            if (!body.includes("Batch Processing Request") && !body.includes("Batch ID:")) {
              // Exit: This issue was not created with the batch processing form
              core.info("Not a batch-processing issue. Skipping retitle.");
              return;
            }

            // Parse fields as before
            const batchIdMatch = body.match(/Batch ID:\s*(.+)/);
            const seasonMatch = body.match(/Season:\s*(.+)/);

            const batchId = batchIdMatch ? batchIdMatch[1].trim() : "";
            const season = seasonMatch ? seasonMatch[1].trim() : "";

            // Compose new title
            const newTitle = `${batchId} ${season} Batch Processing Request`;

            // Update the issue title
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: newTitle,
            });
