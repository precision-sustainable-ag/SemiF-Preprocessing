#   ColorSpace:                               #	Short	The color space information tag is always recorded as the color space specifier. Normally sRGB is used to define the color space based on the PC monitor conditions and environment. If a color space other than sRGB is used, Uncalibrated is set. Image data recorded as Uncalibrated can be treated as sRGB when it is converted to FlashPix.
#   PixelXDimension:                          #	Long	Information specific to compressed data. When a compressed file is recorded, the valid width of the meaningful image must be recorded in this tag, whether or not there is padding data or a restart marker. This tag should not exist in an uncompressed file.
#   PixelYDimension:                          #	Long	Information specific to compressed data. When a compressed file is recorded, the valid height of the meaningful image must be recorded in this tag, whether or not there is padding data or a restart marker. This tag should not exist in an uncompressed file. Since data padding is unnecessary in the vertical direction, the number of lines recorded in this valid image height tag will in fact be the same as that recorded in the SOF.
#   RelatedSoundFile:                         #	Ascii	This tag is used to record the name of an audio file related to the image data. The only relational information recorded here is the Exif audio file name and extension (an ASCII string consisting of 8 characters + '.' + 3 characters). The path is not recorded.
#   InteroperabilityTag:                      #	Long	Interoperability IFD is composed of tags which stores the information to ensure the Interoperability and pointed by the following tag located in Exif IFD. The Interoperability structure of Interoperability IFD is the same as TIFF defined IFD structure but does not contain the image data characteristically compared with normal TIFF IFD.
#   FlashEnergy:                              #	Rational	Indicates the strobe energy at the time the image is captured, as measured in Beam Candle Power Seconds (BCPS).
#   SpatialFrequencyResponse:                 #	Undefined	This tag records the camera or input device spatial frequency table and SFR values in the direction of image width, image height, and diagonal direction, as specified in ISO 12233.
#   FocalPlaneXResolution:                    #	Rational	Indicates the number of pixels in the image width (X) direction per <FocalPlaneResolutionUnit> on the camera focal plane.
#   FocalPlaneYResolution:                    #	Rational	Indicates the number of pixels in the image height (V) direction per <FocalPlaneResolutionUnit> on the camera focal plane.
#   FocalPlaneResolutionUnit:                 #	Short	Indicates the unit for measuring <FocalPlaneXResolution> and <FocalPlaneYResolution>. This value is the same as the <ResolutionUnit>.
#   SubjectLocation:                          #	Short	Indicates the location of the main subject in the scene. The value of this tag represents the pixel at the center of the main subject relative to the left edge, prior to rotation processing as per the <Rotation> tag. The first value indicates the X column number and second indicates the Y row number.
#   ExposureIndex:                            #	Rational	Indicates the exposure index selected on the camera or input device at the time the image is captured.
#   SensingMethod:                            #	Short	Indicates the image sensor type on the camera or input device.
#   FileSource:                               #	Undefined	Indicates the image source. If a DSC recorded the image, this tag value of this tag always be set to 3, indicating that the image was recorded on a DSC.
#   SceneType:                                #	Undefined	Indicates the type of scene. If a DSC recorded the image, this tag value must always be set to 1, indicating that the image was directly photographed.
#   CFAPattern:                               #	Undefined	Indicates the color filter array (CFA) geometric pattern of the image sensor when a one-chip color area sensor is used. It does not apply to all sensing methods.
#   CustomRendered:                           #	Short	This tag indicates the use of special processing on image data, such as rendering geared to output. When special processing is performed, the reader is expected to disable or minimize any further processing.
#   ExposureMode:                             #	Short	This tag indicates the exposure mode set when the image was shot. In auto-bracketing mode, the camera shoots a series of frames of the same scene at different exposure settings.
#   WhiteBalance:                             #	Short	This tag indicates the white balance mode set when the image was shot.
#   DigitalZoomRatio:                         #	Rational	This tag indicates the digital zoom ratio when the image was shot. If the numerator of the recorded value is 0, this indicates that digital zoom was not used.
  FocalLengthIn35mmFormat: 46                 #	Short	This tag indicates the equivalent focal length assuming a 35mm film camera, in mm. A value of 0 means the focal length is unknown. Note that this tag differs from the <FocalLength> tag.
#   SceneCaptureType:                         #	Short	This tag indicates the type of scene that was shot. It can also be used to record the mode in which the image was shot. Note that this differs from the <SceneType> tag.
#   GainControl:                              #	Short	This tag indicates the degree of overall image gain adjustment.
#   Contrast:                                 #	Short	This tag indicates the direction of contrast processing applied by the camera when the image was shot.
#   Saturation:                               #	Short	This tag indicates the direction of saturation processing applied by the camera when the image was shot.
#   Sharpness:                                #	Short	This tag indicates the direction of sharpness processing applied by the camera when the image was shot.
#   DeviceSettingDescription:                 #	Undefined	This tag indicates information on the picture-taking conditions of a particular camera model. The tag is used only to indicate the picture-taking conditions in the reader.
#   SubjectDistanceRange:                     #	Short	This tag indicates the distance to the subject.
#   ImageUniqueID:                            #	Ascii	This tag indicates an identifier assigned uniquely to each image. It is recorded as an ASCII string equivalent to hexadecimal notation and 128-bit fixed length.
#   CameraOwnerName:                          #	Ascii	This tag records the owner of a camera used in photography as an ASCII string.
#   BodySerialNumber:                         #	Ascii	This tag records the serial number of the body of the camera that was used in photography as an ASCII string.
#   LensSpecification:                        #	Rational	This tag notes minimum focal length, maximum focal length, minimum F number in the minimum focal length, and minimum F number in the maximum focal length, which are specification information for the lens that was used in photography. When the minimum F number is unknown, the notation is 0/0
#   LensMake:                                 #	Ascii	This tag records the lens manufactor as an ASCII string.
  LensModel: Linos Inspect XL 60mm            #	Ascii	This tag records the lens's model name and model number as an ASCII string.
#   LensSerialNumber:                         #	Ascii	This tag records the serial number of the interchangeable lens that was used in photography as an ASCII string.
#   ImageTitle:                               #	Ascii	This tag records the title of the image.
#   Photographer:                             #	Ascii	This tag records the name of the photographer.
#   ImageEditor:                              #	Ascii	This tag records the name of the main person who edited the image. Preferably, a single name is written (individual name, group/organization name, etc.), but multiple main editors may be entered.
#   CameraFirmware:                           #	Ascii	This tag records the name and version of the software or firmware of the camera used to generate the image.
#   RAWDevelopingSoftware:                    #	Ascii	This tag records the name and version of the software used to develop the RAW image.
#   ImageEditingSoftware:                     #	Ascii	This tag records the name and version of the main software used for processing and editing the image. Preferably, a single software is written, but multiple main software may be entered.
#   MetadataEditingSoftware:                  #	Ascii	This tag records the name and version of one software used to edit the metadata of the image without processing or editing of the image data itself.
#   CompositeImage:                           #	Short	Indicates whether the recorded image is a composite image or not.
#   SourceImageNumberOfCompositeImage:        #	Short	Indicates the number of the source images (tentatively recorded images) captured for a composite Image.
#   SourceExposureTimesOfCompositeImage:      #	Undefined	For a composite image, records the parameters relating exposure time of the exposures for generating the said composite image, such as respective exposure times of captured source images (tentatively recorded images).
#   Gamma:                                    #	Rational	Indicates the value of coefficient gamma. The formula of transfer function used for image reproduction is expressed as follows: (reproduced value) = (input value)^gamma. Both reproduced value and input value indicate normalized value, whose minimum value is 0 and maximum value is 1.

# GPSInfo:
#   GPSVersionID:               #	Byte	Indicates the version of <GPSInfoIFD>. The version is given as 2.0.0.0. This tag is mandatory when <GPSInfo> tag is present. (Note: The <GPSVersionID> tag is given in bytes, unlike the <ExifVersion> tag. When the version is 2.0.0.0, the tag value is 02000000.H).
#   GPSLatitudeRef:               #	Ascii	Indicates whether the latitude is north or south latitude. The ASCII value 'N' indicates north latitude, and 'S' is south latitude.
#   GPSLatitude:              #	Rational	Indicates the latitude. The latitude is expressed as three RATIONAL values giving the degrees, minutes, and seconds, respectively. When degrees, minutes and seconds are expressed, the format is dd/1,mm/1,ss/1. When degrees and minutes are used and, for example, fractions of minutes are given up to two decimal places, the format is dd/1,mmmm/100,0/1.
#   GPSLongitudeRef:              #	Ascii	Indicates whether the longitude is east or west longitude. ASCII 'E' indicates east longitude, and 'W' is west longitude.
#   GPSLongitude:               #	Rational	Indicates the longitude. The longitude is expressed as three RATIONAL values giving the degrees, minutes, and seconds, respectively. When degrees, minutes and seconds are expressed, the format is ddd/1,mm/1,ss/1. When degrees and minutes are used and, for example, fractions of minutes are given up to two decimal places, the format is ddd/1,mmmm/100,0/1.
#   GPSAltitudeRef:               #	Byte	Indicates the altitude used as the reference altitude. If the reference is sea level and the altitude is above sea level, 0 is given. If the altitude is below sea level, a value of 1 is given and the altitude is indicated as an absolute value in the GSPAltitude tag. The reference unit is meters. Note that this tag is BYTE type, unlike other reference tags.
#   GPSAltitude:              #	Rational	Indicates the altitude based on the reference in GPSAltitudeRef. Altitude is expressed as one RATIONAL value. The reference unit is meters.
#   GPSTimeStamp:               #	Rational	Indicates the time as UTC (Coordinated Universal Time). <TimeStamp> is expressed as three RATIONAL values giving the hour, minute, and second (atomic clock).
#   GPSSatellites:              #	Ascii	Indicates the GPS satellites used for measurements. This tag can be used to describe the number of satellites, their ID number, angle of elevation, azimuth, SNR and other information in ASCII notation. The format is not specified. If the GPS receiver is incapable of taking measurements, value of the tag is set to NULL.
#   GPSStatus:              #	Ascii	Indicates the status of the GPS receiver when the image is recorded. "A" means measurement is in progress, and "V" means the measurement is Interoperability.
#   GPSMeasureMode:               #	Ascii	Indicates the GPS measurement mode. "2" means two-dimensional measurement and "3" means three-dimensional measurement is in progress.
#   GPSDOP:               #	Rational	Indicates the GPS DOP (data degree of precision). An HDOP value is written during two-dimensional measurement, and PDOP during three-dimensional measurement.
#   GPSSpeedRef:              #	Ascii	Indicates the unit used to express the GPS receiver speed of movement. "K" "M" and "N" represents kilometers per hour, miles per hour, and knots.
#   GPSSpeed:               #	Rational	Indicates the speed of GPS receiver movement.
#   GPSTrackRef:              #	Ascii	Indicates the reference for giving the direction of GPS receiver movement. "T" denotes true direction and "M" is magnetic direction.
#   GPSTrack:               #	Rational	Indicates the direction of GPS receiver movement. The range of values is from 0.00 to 359.99.
#   GPSImgDirectionRef:               #	Ascii	Indicates the reference for giving the direction of the image when it is captured. "T" denotes true direction and "M" is magnetic direction.
#   GPSImgDirection:              #	Rational	Indicates the direction of the image when it was captured. The range of values is from 0.00 to 359.99.
#   GPSMapDatum:              #	Ascii	Indicates the geodetic survey data used by the GPS receiver. If the survey data is restricted to Japan, the value of this tag is "TOKYO" or "WGS-84".
#   GPSDestLatitudeRef:               #	Ascii	Indicates whether the latitude of the destination point is north or south latitude. The ASCII value "N" indicates north latitude, and "S" is south latitude.
#   GPSDestLatitude:              #	Rational	Indicates the latitude of the destination point. The latitude is expressed as three RATIONAL values giving the degrees, minutes, and seconds, respectively. If latitude is expressed as degrees, minutes and seconds, a typical format would be dd/1,mm/1,ss/1. When degrees and minutes are used and, for example, fractions of minutes are given up to two decimal places, the format would be dd/1,mmmm/100,0/1.
#   GPSDestLongitudeRef:              #	Ascii	Indicates whether the longitude of the destination point is east or west longitude. ASCII "E" indicates east longitude, and "W" is west longitude.
#   GPSDestLongitude:               #	Rational	Indicates the longitude of the destination point. The longitude is expressed as three RATIONAL values giving the degrees, minutes, and seconds, respectively. If longitude is expressed as degrees, minutes and seconds, a typical format would be ddd/1,mm/1,ss/1. When degrees and minutes are used and, for example, fractions of minutes are given up to two decimal places, the format would be ddd/1,mmmm/100,0/1.
#   GPSDestBearingRef:              #	Ascii	Indicates the reference used for giving the bearing to the destination point. "T" denotes true direction and "M" is magnetic direction.
#   GPSDestBearing:               #	Rational	Indicates the bearing to the destination point. The range of values is from 0.00 to 359.99.
#   GPSDestDistanceRef:               #	Ascii	Indicates the unit used to express the distance to the destination point. "K", "M" and "N" represent kilometers, miles and nautical miles.
#   GPSDestDistance:              #	Rational	Indicates the distance to the destination point.
#   GPSProcessingMethod:              #	Comment	A character string recording the name of the method used for location finding. The string encoding is defined using the same scheme as UserComment.
#   GPSAreaInformation:               #	Comment	A character string recording the name of the GPS area.The string encoding is defined using the same scheme as UserComment.
#   GPSDateStamp:               #	Ascii	A character string recording date and time information relative to UTC (Coordinated Universal Time). The format is "YYYY:MM:DD.".
#   GPSDifferential:              #	Short	Indicates whether differential correction is applied to the GPS receiver.
#   GPSHPositioningError:               #	Rational	This tag indicates horizontal positioning errors in meters.

