# Hydra defaults and settings. Ignore these (don't change)
defaults:
  - _self_
  - paths: default
  - dng_tags: default
  - exif: default
  - ccm: NC_1740166530
  - batch_ids: test
  - asfm: default
  - date_ranges: default
  - override hydra/job_logging: custom

hydra:
  run:
    dir: ${paths.log_dir}/${season}/${batch_id}/${job_now}
  output_subdir: ${hydra.run.dir}/hydra

job_now: &nowdir ${now:%Y-%m-%d}/${now:%H:%M:%S}

############################################
# Main configuration for the current batch
############################################
batch_id: NC_2025-03-19
season: cool_season_covers_2024_2025_NCpos2
############################################

tasks:
  - sync_from_remote
  - raw2jpg # raw2jpg does raw2dng + dng2jpg
  - update_exif
  - autosfm
  - detect_plants
  - merge_overlapping_bboxes
  - remap_labels
  - assign_species
  - inspect_images
  - move_data
  - report

inspection:
  inspect: false
  use_lts_images: false  # set true to inspect from LTS

rt_pp3_name: NC_2025-02-21
ccm_name:

file_masks:
  raw_files:
    - .RAW
    - .raw
  dng_files:
    - .DNG
    - .dng
  png_files:
    - .png
    - .PNG
  
raw2jpg:
  jpg_samples: 50
  resize_factor: 0.25
  remove_dngs: true

max_workers: 16