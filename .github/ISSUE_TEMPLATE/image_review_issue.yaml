name: 🔍 Image Review Issue
description: Report flagged images and general quality control issues for a batch
title: "[Image Review] {batch_id} - Quality Check Report"
labels: ["quality check"]
assignees: ["@mkutu"]
body:
  - type: markdown
    attributes:
      value: |
        ### **Image Review Issue**
        Use this issue to report flagged images and quality control observations from the inspection.
        If the batch has widespread issues (e.g., potting area cleanliness problems across most images), provide a **general summary** instead of listing every affected image.

  - type: input
    id: batch_id
    attributes:
      label: Batch ID
      description: Enter the batch ID being reviewed (e.g., `NC_2025-02-21`).
      placeholder: "NC_2025-02-21"
    validations:
      required: true

  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: Enter your GitHub username or email.
      placeholder: "your_username"
    validations:
      required: true

  - type: textarea
    id: general_summary
    attributes:
      label: General Summary
      description: Provide a brief overview of the inspection. If there are widespread issues (e.g., potting area cleanliness affecting most images), summarize the main problems instead of listing all flagged images.
      placeholder: |
        Example: 
        - Many images have poor potting area cleanliness, with soil spills and debris in multiple frames.
        - A few images have non-target weeds growing inside the pots.
        - Some images are underexposed or show processing artifacts.
        - Image has the wrong species label.
        - Mask annotations are inaccurate.
    validations:
      required: true

  - type: textarea
    id: flagged_images
    attributes:
      label: Specific Flagged Images (Only if Necessary)
      description: If **only a few** images have specific issues (e.g., bad preprocessing quality, non-target weeds, or plant spacing problems), list them here. Skip this if the issue is widespread.
      placeholder: |
        Example: 
        - `NC_17648429349.jpg` - Non-Target Weeds 
        - `NC_17648431596.jpg` - Preprocessing Quality
        - `NC_17648434320.jpg` - Plant Spacing Issue
        - `NC_17648435189.jpg` - Incorrect Species Label
      
  - type: dropdown
    id: main_issue
    attributes:
      label: Main Issue Type
      description: Select the most common issue type in this batch.
      options:
        - "Preprocessing Quality"
        - "Potting Area Cleanliness (Widespread)"
        - "Non-Target Weeds"
        - "Plant Spacing"
        - "Other"
        - "Inaccurate Species Label"
        - "Mask Annotation Issue"

    validations:
      required: true

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Provide any extra context, concerns, or observations.
      placeholder: "Describe any patterns, concerns, or additional observations."
      
  - type: markdown
    attributes:
      value: |
        ### Screenshots
        If available, please attach screenshots of flagged images for reference.
