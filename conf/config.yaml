# Hydra defaults and settings. Ignore these (don't change)
defaults:
  - _self_
  - paths: default
  - exif: default
  - asfm: default
  - date_ranges: default
  - batch_ids: default
  - override hydra/job_logging: custom

hydra:
  run:
    dir: ${paths.log_dir}/${season}/${batch_id}/${job_now}
  output_subdir: ${hydra.run.dir}/hydra

job_now: &nowdir ${now:%Y-%m-%d}/${now:%H:%M:%S}

############################################
# Main configuration for the current batch
############################################
batch_id: ???
bbot_version: "3.1"
season: ??? # cash_crop_dicamba_2025, summer_weeds_2024  #cool_season_covers_2023_2024, cool_season_covers_2024_2025_bbotv30, cool_season_covers_2024_2025, cool_season_covers_2024_2025_NCpos2, summer_weeds_2024
create_issue: false
crs: ???
gh_reviewer: mkutu # nnotaba or mkutu, map0425
timestamp: # epoch timestamp for raw2jpg. Anything before this timestamp will be ignored in the batch
run_mode: single # single or batch

# Toggle the modes you want to run
modes:
  # - sync
  - correct
  - asfm
  - label
  - deliver

# Toggle the tasks you want to run in each mode
tasks: # task for each mode
  sync:
    - sync_from_remote
  correct:
    - raw2jpg
    - update_exif
  asfm:
    - autosfm
  label:
    - detect_plants
    - merge_overlapping_bboxes
    - remap_labels
    - assign_species
    # - assign_rates # only used for dicamba study
  deliver:
    - inspect_images # deliver
    - move_data # deliver
    - report  # deliver

############################################
############################################

inspection:
  inspect: false
  use_lts_images: false  # set true to inspect from LTS

rt_pp3_name: NC_2025-02-21
ccm_name:

file_masks:
  raw_files:
    - .RAW
    - .raw
  dng_files:
    - .DNG
    - .dng
  png_files:
    - .png
    - .PNG
  
raw2jpg:
  jpg_samples: 0
  resize_factor: 0.25
  remove_dngs: true

max_workers: 16


report:
  save2lts: true
  sample_size: 96 # best if this is a multiple of 12