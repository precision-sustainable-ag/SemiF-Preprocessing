name: Create Inspection Report Issue

on:
  repository_dispatch:
    types: [report-generated]

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.REPORT_BOT_PAT }}
          BATCH_ID: ${{ github.event.client_payload.batch_id }}
          ASSIGNEE: ${{ github.event.client_payload.assignee }}
          REPO: ${{ github.repository }}
          GLOBUS_PREFIX: https://m-ae9b45.7ce1a.03c0.data.globus.org/rsstu/users/s/screberg/longterm_images2/semifield-developed-images
        run: |
          import os
          import requests

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          batch_id = os.environ['BATCH_ID']
          assignee = os.environ['ASSIGNEE']
          globus_prefix = os.environ['GLOBUS_PREFIX']

          globus_link = f"{globus_prefix}/{batch_id}/inspection/{batch_id}_report.pdf"

          title = f"📄 Inspection Report Ready: {batch_id}"

          body = (
              "### 📋 New Report Available\n\n"
              f"The inspection report for batch `{batch_id}` is now available.\n\n"
              f"🔗 [Click here to view the report]({globus_link})\n\n"
              f"_Assigned to @{assignee}_"
          )

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }

          payload = {
              "title": title,
              "body": body,
              "assignees": [assignee]
          }

          response = requests.post(
              f"https://api.github.com/repos/{repo}/issues",
              headers=headers,
              json=payload
          )

          if response.ok:
              print("✅ Issue created:", response.json()['html_url'])
          else:
              print("❌ Failed:", response.status_code, response.text)
              exit(1)
