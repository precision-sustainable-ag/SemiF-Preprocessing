name: Batch Processing Request
description: Submit a new batch processing task
labels: [batch-request]
body:
  - type: markdown
    attributes:
      value: |
        ## **WARNING**
         All images must be fully uploaded to the NCSU shared NFS storage before submitting this request. Upload time varies with dataset size; for more than ~200 images, allow at least 2 hours for the transfer to complete.
        
        ### **Info**
        - BenchBot operators: please complete all fields.
        - Unsure about "Perform Reconstruction" or any other option? Please contact @mkutu for guidance.

  # --- Core ---
  - type: markdown
    attributes:
      value: "### Core"

  - type: input
    id: template_id
    attributes:
      label: Template ID
      description: For internal use only; do not modify.
      value: Batch Processing Request Form
    validations:
      required: true

  - type: input
    id: batch_id
    attributes:
      label: Batch ID
      description: Use STATE_YYYY-MM-DD (e.g., MD_2025-07-09)
      placeholder: e.g., MD_2025-07-09
    validations:
      required: true
      pattern: '^[A-Z]{2}_[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      message: "Format must be STATE_YYYY-MM-DD (e.g., MD_2025-07-09)."

  # --- Scheduling ---
  - type: markdown
    attributes:
      value: "### Scheduling "

  - type: input
    id: start_time
    attributes:
      label: Start Time
      description: Start time (H:MM:SS AM/PM) using BenchBot local time
      placeholder: e.g., 1:30:37 AM
    validations:
      required: false
      pattern: '^\s*([1-9]|1[0-2]):[0-5][0-9]:[0-5][0-9]\s?(AM|PM)\s*$'
      message: "Use H:MM:SS AM/PM (e.g., 1:30:37 AM)."

  - type: input
    id: end_time
    attributes:
      label: End Time
      description: End time (H:MM:SS AM/PM) using BenchBot local time
      placeholder: e.g., 12:15:45 PM
    validations:
      required: false
      pattern: '^\s*([1-9]|1[0-2]):[0-5][0-9]:[0-5][0-9]\s?(AM|PM)\s*$'
      message: "Use H:MM:SS AM/PM (e.g., 12:15:45 PM)."

  # --- Processing options ---
  - type: markdown
    attributes:
      value: "### Processing options"

  - type: dropdown
    id: single_species
    attributes:
      label: Single Species
      description: Process a single species (sets a default label).
      options:
        - 'true'
        - 'false'
    validations:
      required: true

  - type: dropdown
    id: single_species_name
    attributes:
      label: Single Species Common Name
      description: Select if **Single Species** is true (otherwise leave blank).
      options:
        - 'soybean'
        - 'zoysia'
        - 'beet'

  - type: dropdown
    id: reconstruct
    attributes:
      label: Perform Reconstruction
      description: Whether to run 3D reconstruction on the images.
      options:
        - 'true'
        - 'false'
    validations:
      required: true

  - type: input
    id: skip_first_n_images
    attributes:
      label: Skip First N Images
      description: Number of images to skip at the beginning
      placeholder: e.g., 3
    validations:
      required: false
      pattern: '^\d+$'
      message: "Enter a non-negative integer."

  - type: input
    id: skip_last_n_images
    attributes:
      label: Skip Last N Images
      description: Number of images to skip at the end
      placeholder: e.g., 3
    validations:
      required: false
      pattern: '^\d+$'
      message: "Enter a non-negative integer."

  # --- Context ---
  - type: markdown
    attributes:
      value: "### Notes (please provide any relevant information)"


  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any relevant notes, observations, or issues

  # --- Capture details ---
  - type: markdown
    attributes:
      value: "### Capture details"

  - type: input
    id: num_images
    attributes:
      label: Number of Images Taken
      description: Total number of images collected
      placeholder: e.g., 684
    validations:
      required: false
      pattern: '^\d+$'
      message: "Enter a non-negative integer."

  - type: dropdown
    id: camera_angle
    attributes:
      label: Camera Angle
      description: Select the camera angle used for imaging.
      options:
        - '0 degrees'
        - '20 degrees'

  - type: input
    id: x_axis_start
    attributes:
      label: X-axis Start (cm)
      description: X-axis starting position
      placeholder: e.g., 40
    validations:
      required: false
      pattern: '^\d+(\.\d+)?$'
      message: "Enter a number (integer or decimal)."

  - type: input
    id: z_axis_start
    attributes:
      label: Z-axis Start (cm)
      description: Z-axis starting position
      placeholder: e.g., 170
    validations:
      required: false
      pattern: '^\d+(\.\d+)?$'
      message: "Enter a number (integer or decimal)."

  - type: input
    id: pots_per_row
    attributes:
      label: Pots per Row
      description: Number of pots per row
      placeholder: e.g., 12
    validations:
      required: false
      pattern: '^\d+$'
      message: "Enter a non-negative integer."

  - type: input
    id: bbot_row_spacing
    attributes:
      label: BBot Settings Row Spacing (cm)
      description: Row spacing you input into the Bbot control panel (might differ than what's actually used)
      placeholder: e.g., 95
    validations:
      required: false
      pattern: '^\d+(\.\d+)?$'
      message: "Enter a number (integer or decimal)."

  - type: input
    id: ground_row_spacing
    attributes:
      label: On-the-ground Row Spacing (cm)
      description: Actual row spacing on the ground
      placeholder: e.g., 40
    validations:
      required: false
      pattern: '^\d+(\.\d+)?$'
      message: "Enter a number (integer or decimal)."

  - type: input
    id: pot_spacing
    attributes:
      label: Pot Spacing (cm)
      description: Spacing between pots
      placeholder: e.g., 43
    validations:
      required: false
      pattern: '^\d+(\.\d+)?$'
      message: "Enter a number (integer or decimal)."

  - type: input
    id: num_rows_imaged
    attributes:
      label: Number of Rows Imaged
      description: Total number of rows imaged
      placeholder: e.g., 57
    validations:
      required: false
      pattern: '^\d+$'
      message: "Enter a non-negative integer."

  # --- Camera settings  ---
  - type: markdown
    attributes:
      value: "### Camera settings"

  - type: input
    id: aperture
    attributes:
      label: Aperture (f/)
      description: Camera aperture (e.g., 13.5)
      placeholder: e.g., 13.5
    validations:
      required: false
      pattern: '^\d+(\.\d+)?$'
      message: "Enter a number (integer or decimal)."

  - type: input
    id: focus
    attributes:
      label: Focus
      description: Camera focus value (e.g., 20.3)
      placeholder: e.g., 20.3
    validations:
      required: false
      pattern: '^\d+(\.\d+)?$'
      message: "Enter a number (integer or decimal)."

  - type: input
    id: flash_power
    attributes:
      label: Flash Power
      description: Flash power setting (e.g., 1/1)
      placeholder: e.g., 1/1
    validations:
      required: false
